# Pages CMS pilot: edit a test branch, never publish test content to main.
settings:
  content:
    merge: true
media:
  input: images/uploads
  output: /images/uploads
  rename: safe
  extensions: [jpg, jpeg, png, webp]
content:
  - name: news
    label: News
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{fields.title}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
        default: ""
        description: "Use YYYY-MM-DD. On creation, match the filename prefix; when editing old news, use its existing filename date. Changing this date can change the Jekyll URL."
        options:
          time: false
          format: yyyy-MM-dd
      - name: category
        label: Category
        type: select
        options:
          values: [Publication, Research, Lab Life, Event, Recruitment]
      - name: summary
        label: Summary
        type: text
      - name: author
        label: Author
        type: string
        description: "Use an existing member slug where applicable; preserve the original value on old news."
      - name: image
        label: Cover image
        type: image
      - name: image_caption
        label: Image caption
        type: text
      - name: doi
        label: DOI or related link
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
  - name: team
    label: Team members
    type: collection
    path: _members
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{fields.name}.md"
      field: create
    operations:
      create: true
      rename: false
      delete: false
    view:
      primary: name
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Position
        type: select
        required: true
        options:
          values:
            - name: principal-investigator
              label: Principal Investigator
            - name: postdoc
              label: Postdoctoral Researcher
            - name: phd
              label: PhD Student
            - name: undergrad
              label: Undergraduate Student
            - name: programmer
              label: Programmer
            - name: mascot
              label: Mascot
      - name: image
        label: Portrait
        type: image
        description: "Keep the existing portrait unless replacing it with an authorized image. Uploads use images/uploads and are rendered with relative_url."
      - name: description
        label: Position description
        type: string
      - name: affiliation
        label: Affiliation
        type: string
      - name: group
        label: Group
        type: string
        description: "Preserve existing values such as alum; this does not replace the position field."
      - name: aliases
        label: Author name aliases
        type: string
        list: true
      - name: links
        label: Profile links
        type: object
        fields:
          - name: home-page
            label: Personal website URL
            type: string
          - name: orcid
            label: ORCID identifier
            type: string
          - name: github
            label: GitHub username
            type: string
          - name: email
            label: Email
            type: string
          - name: twitter
            label: Twitter username
            type: string
      - name: body
        label: Biography
        type: rich-text
        options:
          format: markdown
          media: false
          switcher: true
  - name: home
    label: Home — About Us
    type: file
    path: _data/home.yaml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: about_us
        label: About Us introduction (Markdown)
        type: rich-text
        options:
          format: markdown
          media: false
      - name: research_preview_intro
        label: Homepage research introduction (Markdown)
        type: rich-text
        options:
          format: markdown
          media: false
  - name: research
    label: Research — directions and homepage previews
    type: file
    path: _data/research.yaml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: intro
        label: Research page introduction (Markdown)
        type: rich-text
        options:
          format: markdown
          media: false
      - name: directions
        label: Research directions — add or edit entries here
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} (order {order})"
        fields:
          - name: title
            label: Direction title
            type: string
            required: true
          - name: description
            label: Full introduction (Markdown)
            type: rich-text
            options:
              format: markdown
              media: false
          - name: image
            label: Optional authorized display image
            type: image
          - name: order
            label: Display order — smaller numbers first
            type: number
            required: true
            default: 10
          - name: show_on_home
            label: Show on homepage (first three by order)
            type: boolean
            default: false
          - name: home_summary
            label: Homepage summary (Markdown; blank uses full introduction)
            type: rich-text
            options:
              format: markdown
              media: false
          - name: confirmed
            label: Confirmed by lab lead (leave off for placeholders)
            type: boolean
            default: false
  - name: join_us
    label: Join Us — public recruitment
    type: file
    path: _data/join_us.yaml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: intro
        label: Page introduction
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: rich-text
            options:
              format: markdown
              media: false
          - name: zh
            label: Chinese — reserved for phase 5
            type: rich-text
            options:
              format: markdown
              media: false
      - name: positions_placeholder
        label: No confirmed positions — placeholder notice
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: rich-text
            options:
              format: markdown
              media: false
          - name: zh
            label: Chinese — reserved for phase 5
            type: rich-text
            options:
              format: markdown
              media: false
      - name: application_instructions
        label: How to Apply — public instructions
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: rich-text
            options:
              format: markdown
              media: false
          - name: zh
            label: Chinese — reserved for phase 5
            type: rich-text
            options:
              format: markdown
              media: false
      - name: ai_coming_soon
        label: AI Coming Soon — possible future features
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: rich-text
            options:
              format: markdown
              media: false
          - name: zh
            label: Chinese — reserved for phase 5
            type: rich-text
            options:
              format: markdown
              media: false
      - name: positions
        label: Positions — add entries and sort by number
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{id} — {status} (order {order})"
        fields:
          - name: id
            label: Stable unique ID — do not change once published
            type: string
            required: true
          - name: title
            label: Position title
            type: object
            fields:
              - name: en
                label: English — displayed now
                type: text
              - name: zh
                label: Chinese — reserved for phase 5
                type: text
          - name: description
            label: Position introduction
            type: object
            fields:
              - name: en
                label: English — displayed now
                type: rich-text
                options:
                  format: markdown
                  media: false
              - name: zh
                label: Chinese — reserved for phase 5
                type: rich-text
                options:
                  format: markdown
                  media: false
          - name: application_instructions
            label: Position application instructions
            type: object
            fields:
              - name: en
                label: English — displayed now
                type: rich-text
                options:
                  format: markdown
                  media: false
              - name: zh
                label: Chinese — reserved for phase 5
                type: rich-text
                options:
                  format: markdown
                  media: false
          - name: status
            label: Status — open still requires confirmation
            type: select
            required: true
            default: placeholder
            options:
              values: [open, closed, placeholder]
          - name: order
            label: Display order — smaller numbers first
            type: number
            required: true
            default: 10
          - name: deadline
            label: Optional deadline — enter only a confirmed date
            type: date
            default: ""
            options:
              time: false
              format: yyyy-MM-dd
          - name: confirmed
            label: Confirmed by lab lead — required for an open announcement
            type: boolean
            default: false
  - name: contact
    label: Contact — shared public details
    type: file
    path: _data/contact.yaml
    format: yaml
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: email
        label: Confirmed public email
        type: string
      - name: phone
        label: Confirmed public telephone
        type: string
      - name: address
        label: Public address
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: text
          - name: zh
            label: Chinese — reserved for phase 5
            type: text
      - name: placeholder
        label: Unconfirmed contact notice
        type: object
        fields:
          - name: en
            label: English — displayed now
            type: rich-text
            options:
              format: markdown
              media: false
          - name: zh
            label: Chinese — reserved for phase 5
            type: rich-text
            options:
              format: markdown
              media: false
      - name: confirmed
        label: All populated details verified by lab lead
        type: boolean
        default: false
      - name: links
        label: Optional verified public links
        type: object
        list: true
        fields:
          - name: label
            label: Link label
            type: object
            fields:
              - name: en
                label: English — displayed now
                type: text
              - name: zh
                label: Chinese — reserved for phase 5
                type: text
          - name: url
            label: Full https URL or internal /path/ — no private links
            type: string
