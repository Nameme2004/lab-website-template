{% assign search_labels = site.data.i18n.search %}
{% if include.context == 'publications' %}{% assign search_labels = site.data.i18n.publications_search %}{% endif %}
<div class="search-box"{% if include.live %} data-search-live{% endif %}>
  <input
    type="text"
    class="search-input"
    oninput="onSearchInput(this)"
    placeholder="Search items on this page"
    data-placeholder-en="{{ search_labels.placeholder.en | xml_escape }}"
    data-placeholder-zh="{{ search_labels.placeholder.zh | xml_escape }}"
    aria-label="{{ search_labels.placeholder.en | xml_escape }}"
  />
  <button
    disabled
    data-tooltip="Clear search"
    aria-label="clear search"
    data-label-en="{{ site.data.i18n.search.clear.en | xml_escape }}"
    data-label-zh="{{ site.data.i18n.search.clear.zh | xml_escape }}"
    onclick="onSearchClear()"
  >
    {% include icon.html icon="fa-solid fa-magnifying-glass" %}
  </button>
</div>
